# 🌐 VPS Host Nginx Configuration File
# Use this file if you install Nginx directly on your VPS (Ubuntu/Debian)
# Location on VPS: /etc/nginx/sites-available/tot_project.conf
# Enable with: sudo ln -s /etc/nginx/sites-available/tot_project.conf /etc/nginx/sites-enabled/
# Test with: sudo nginx -t && sudo systemctl reload nginx

upstream docker_frontend {
    server 127.0.0.1:5173;
}

upstream docker_backend {
    server 127.0.0.1:6001;
}

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com; # Or your VPS IP: server_name _;

    client_max_body_size 50M;

    # Gzip settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Express Backend API Routes
    location ~ ^/(api|auth|verify-code)/ {
        proxy_pass http://docker_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Backend Login endpoints
    location ~ ^/login/(profile|update-attempt) {
        proxy_pass http://docker_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Backend Admin API endpoints
    location ~ ^/admin/(user|secret|user-answers|marksheet) {
        proxy_pass http://docker_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # 2. Frontend React Application
    location / {
        proxy_pass http://docker_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
