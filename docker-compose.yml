
services:
  # ১. এক্সপ্রেস ব্যাকএন্ড সার্ভিস
  backend-app:
    build:
      context: ./backend # আপনার ব্যাকএন্ড ফোল্ডারের পাথ
      dockerfile: Dockerfile
    ports:
      - "6001:6001"
    environment:
      - PORT=6001
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}  # 🌟 Inside Docker network, this points to the database container
      - DB_PORT=${DB_PORT}          # 🌟 Inside Docker network, use the internal port 5432
      - DB_DATABASE=${DB_DATABASE}
      - REDIS_URL=redis://redis-cache:6378
      - FRONTEND_URL=http://localhost:5173
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - postgres-db
      - redis-cache
    networks:
      - quiz-network

  # ২. রিঅ্যাক্ট ফ্রন্টএন্ড সার্ভিস (Vite)
  frontend-app:
    build:
      context: ./frontend # আপনার ফ্রন্টএন্ড ফোল্ডারের পাথ
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:6001
    depends_on:
      - backend-app
    networks:
      - quiz-network

  # ৩. পোস্টগ্রেস ডাটাবেজ সার্ভিস
  postgres-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${DB_USER}         # ডকারকে বোঝানোর জন্য বামে POSTGRES_USER ই রাখতে হবে
      - POSTGRES_PASSWORD=${DB_PASSWORD} # বামে POSTGRES_PASSWORD ই রাখতে হবে
      - POSTGRES_DB=${DB_DATABASE}
    ports:
      - "5433:5432" # এটি দেওয়ার কারণে আপনি লোকাল pgAdmin দিয়েও কানেক্ট করতে পারবেন
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - quiz-network

  # ৪. রেডিস ক্যাশ সার্ভিস
  redis-cache:
    image: redis:7-alpine
    ports:
      - "6379:6378" # এটি দেওয়ার কারণে লোকাল Redis Insight দিয়ে দেখতে পারবেন
    networks:
      - quiz-network

volumes:
  pgdata: # ডাটাবেজের ডাটা যেন কন্টেইনার ডিলিট হলেও মুছে না যায়
  - .:/app          # আপনার কম্পিউটারের বর্তমান ফোল্ডার (.) কন্টেইনারের /app এর সাথে লিংক করবে
  - /app/node_modules # (অপশনাল) নোড প্রজেক্ট হলে নোড মডিউল ওভাররাইট হওয়া ঠেকাতে

networks:
  quiz-network:
    driver: bridge

