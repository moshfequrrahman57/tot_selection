# version: '3.8'

services:
  # ১. এক্সপ্রেস ব্যাকএন্ড সার্ভিস
  backend-app:
    build:
      context: ./backend # আপনার ব্যাকএন্ড ফোল্ডারের পাথ
      dockerfile: Dockerfile
    ports:
      - "6001:6001"
    environment:
      - PORT=6001
      # 🟢 Map the exact keys your server.js is looking for:
      - DB_USER=quiz_db_705k_user
      - DB_PASSWORD=u50AeCs2GuGn53qbpv9Y2Q6eeX0VHA3S
      - DB_HOST=dpg-daume2rtqb8s73bujarg-a  # 🌟 Inside Docker network, this points to the database container
      - DB_PORT=5432          # 🌟 Inside Docker network, use the internal port 5432
      - DB_DATABASE=quiz_db_705k
      - REDIS_URL=redis://red-daumlrflk1mc73dg0740:6379
      - FRONTEND_URL=https://tot-selection-backup-1.onrender.com
    depends_on:
      - postgres-db
      - redis-cache
    networks:
      - quiz-network

  # ২. রিঅ্যাক্ট ফ্রন্টএন্ড সার্ভিস (Vite)
  frontend-app:
    build:
      context: ./frontend # আপনার ফ্রন্টএন্ড ফোল্ডারের পাথ
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=https://tot-selection-backup.onrender.com
    depends_on:
      - backend-app
    networks:
      - quiz-network

  # ৩. পোস্টগ্রেস ডাটাবেজ সার্ভিস
  postgres-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=quiz_db_705k_user
      - POSTGRES_PASSWORD=u50AeCs2GuGn53qbpv9Y2Q6eeX0VHA3S
      - POSTGRES_DB=quiz_db_705k
    ports:
      - "5432:5432" # এটি দেওয়ার কারণে আপনি লোকাল pgAdmin দিয়েও কানেক্ট করতে পারবেন
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - quiz-network

  # ৪. রেডিস ক্যাশ সার্ভিস
  redis-cache:
    image: redis:7-alpine
    ports:
      - "6379:6379" # এটি দেওয়ার কারণে লোকাল Redis Insight দিয়ে দেখতে পারবেন
    networks:
      - quiz-network

volumes:
  pgdata: # ডাটাবেজের ডাটা যেন কন্টেইনার ডিলিট হলেও মুছে না যায়
  - .:/app          # আপনার কম্পিউটারের বর্তমান ফোল্ডার (.) কন্টেইনারের /app এর সাথে লিংক করবে
  - /app/node_modules # (অপশনাল) নোড প্রজেক্ট হলে নোড মডিউল ওভাররাইট হওয়া ঠেকাতে

networks:
  quiz-network:
    driver: bridge
