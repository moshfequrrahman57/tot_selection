services:
  # 1. Express Backend Service
  backend-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "6001:6001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - PORT=6001
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}  # Inside Docker network, points to postgres-db
      - DB_PORT=${DB_PORT}  # Inside Docker network, uses 5432
      - DB_DATABASE=${DB_DATABASE}
      - REDIS_URL=redis://redis-cache:6379
      - FRONTEND_URL=http://localhost:5173
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_started
    networks:
      - quiz-network

  # 2. React Frontend Service (Vite)
  frontend-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:6001
    depends_on:
      - backend-app
    networks:
      - quiz-network

  # 3. PostgreSQL Database Service
  postgres-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DATABASE}
    ports:
      - "5433:5432" # Local pgAdmin connection on 5433
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d  # 🌟 Automatically executes schema.sql to create tables on first run!
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - quiz-network

  # 4. Redis Cache Service
  redis-cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - quiz-network

volumes:
  pgdata: # Database persistent volume

networks:
  quiz-network:
    driver: bridge
